      updated_not_active: "Sua senha foi alterada com sucesso."
    registrations:
      destroyed: "Sua conta foi excluída com sucesso."
      signed_up: "Bem-vindo(a)! Sua conta foi criada com sucesso."
      signed_up_but_inactive: "Sua conta foi criada com sucesso. No entanto, não foi possível fazer login pois sua conta ainda não foi ativada."
      signed_up_but_locked: "Sua conta foi criada com sucesso. No entanto, não foi possível fazer login pois sua conta está bloqueada."
      signed_up_but_unconfirmed: "Uma mensagem com um link de confirmação foi enviada para seu e-mail. Por favor, clique no link para ativar sua conta."
      update_needs_confirmation: "Você atualizou sua conta com sucesso, mas precisamos verificar seu novo e-mail. Por favor, verifique seu e-mail e clique no link de confirmação."
      updated: "Sua conta foi atualizada com sucesso."
      updated_but_not_signed_in: "Sua conta foi atualizada com sucesso, mas como sua senha foi alterada, por favor, faça login novamente."
    sessions:
      signed_in: "Login efetuado com sucesso."
      signed_out: "Logout efetuado com sucesso."
      already_signed_out: "Logout efetuado com sucesso."
