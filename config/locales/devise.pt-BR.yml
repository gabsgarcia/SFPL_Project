      failure: "Não foi possível autenticar com %{kind} pois \"%{reason}\"."
      success: "Autenticado com sucesso pela conta %{kind}."
    passwords:
      no_token: "Você só pode acessar esta página a partir de um link de redefinição de senha. Se você veio de um e-mail de redefinição de senha, certifique-se de usar a URL completa fornecida."
