        instruction_2: "Caso não tenha solicitado, ignore este e-mail. Sua senha não será alterada."
        instruction_3: "Sua senha só será alterada se você acessar o link acima e criar uma nova senha."
        subject: "Instruções para redefinir senha"
      unlock_instructions:
        action: "Desbloquear minha conta"
        greeting: "Olá, %{recipient}!"
        instruction: "Clique no link abaixo para desbloquear sua conta:"
        message: "Sua conta foi bloqueada por excesso de tentativas de login sem sucesso."
        subject: "Instruções para desbloqueio de conta"
