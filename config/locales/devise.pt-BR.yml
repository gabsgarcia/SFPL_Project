      unlocked: "Sua conta foi desbloqueada com sucesso. Por favor, faça login para continuar."
  errors:
    messages:
      already_confirmed: "já foi confirmada, por favor tente fazer login."
      confirmation_period_expired: "precisa ser confirmada em %{period}, por favor solicite uma nova."
      expired: "expirou, por favor solicite uma nova."
      not_found: "não encontrado."
      not_locked: "não estava bloqueado."
      not_saved:
