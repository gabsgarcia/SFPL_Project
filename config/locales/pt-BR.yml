pt-BR:
  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d/%m"
      long: "%d de %B de %Y"
    day_names:
      - domingo
      - segunda-feira
      - terça-feira
      - quarta-feira
      - quinta-feira
      - sexta-feira
      - sábado
    abbr_day_names:
      - Dom
      - Seg
      - Ter
      - Qua
      - Qui
      - Sex
      - Sáb
    month_names:
      - ~
      - janeiro
      - fevereiro
      - março
      - abril
      - maio
      - junho
      - julho
      - agosto
      - setembro
      - outubro
      - novembro
      - dezembro
    abbr_month_names:
      - ~
      - Jan
      - Fev
      - Mar
      - Abr
      - Mai
      - Jun
      - Jul
      - Ago
      - Set
      - Out
      - Nov
      - Dez

  time:
    formats:
      default: "%d/%m/%Y %H:%M"
      short: "%H:%M"
      long: "%d de %B de %Y, %H:%M"
    am: "AM"
    pm: "PM"

  datetime:
    distance_in_words:
      about_x_hours:
        one: "aproximadamente 1 hora"
        other: "aproximadamente %{count} horas"
      about_x_months:
        one: "aproximadamente 1 mês"
        other: "aproximadamente %{count} meses"
      about_x_years:
        one: "aproximadamente 1 ano"
        other: "aproximadamente %{count} anos"
      almost_x_years:
        one: "quase 1 ano"
        other: "quase %{count} anos"
      half_a_minute: "meio minuto"
      less_than_x_minutes:
        one: "menos de 1 minuto"
        other: "menos de %{count} minutos"
      less_than_x_seconds:
        one: "menos de 1 segundo"
        other: "menos de %{count} segundos"
      over_x_years:
        one: "mais de 1 ano"
        other: "mais de %{count} anos"
      x_days:
        one: "1 dia"
        other: "%{count} dias"
      x_minutes:
        one: "1 minuto"
        other: "%{count} minutos"
      x_months:
        one: "1 mês"
        other: "%{count} meses"
      x_seconds:
        one: "1 segundo"
        other: "%{count} segundos"
      x_years:
        one: "1 ano"
        other: "%{count} anos"

  number:
    currency:
      format:
        unit: "R$"
        separator: ","
        delimiter: "."
        format: "%u %n"

  activerecord:
    errors:
      messages:
        accepted: "deve ser aceito"
        blank: "não pode ficar em branco"
        confirmation: "não é igual a %{attribute}"
        empty: "não pode ficar vazio"
        equal_to: "deve ser igual a %{count}"
        even: "deve ser par"
        exclusion: "não está disponível"
        greater_than: "deve ser maior que %{count}"
        greater_than_or_equal_to: "deve ser maior ou igual a %{count}"
        inclusion: "não está incluído na lista"
        invalid: "não é válido"
        less_than: "deve ser menor que %{count}"
        less_than_or_equal_to: "deve ser menor ou igual a %{count}"
        model_invalid: "Validação falhou: %{errors}"
        not_a_number: "não é um número"
        not_an_integer: "deve ser um número inteiro"
        odd: "deve ser ímpar"
        other_than: "deve ser diferente de %{count}"
        present: "deve ficar em branco"
        required: "deve existir"
        taken: "já está em uso"
        too_long:
          one: "é muito longo (máximo: 1 caractere)"
          other: "é muito longo (máximo: %{count} caracteres)"
        too_short:
          one: "é muito curto (mínimo: 1 caractere)"
          other: "é muito curto (mínimo: %{count} caracteres)"
        wrong_length:
          one: "não tem o tamanho certo (deve ter 1 caractere)"
          other: "não tem o tamanho certo (deve ter %{count} caracteres)"
      template:
        body: "Por favor, verifique o(s) seguinte(s) campo(s):"
        header:
          one: "Não foi possível salvar este %{model}: 1 erro encontrado."
          other: "Não foi possível salvar este %{model}: %{count} erros encontrados."

  helpers:
    select:
      prompt: "Selecione..."
    submit:
      create: "Criar %{model}"
      submit: "Salvar %{model}"
      update: "Atualizar %{model}"
